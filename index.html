<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>roxpelt_designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#111322; --muted:#6b7088; --line:#e7e9f1;
  --blue:#3b5bff; --pink:#f0508c; --green:#25c26e; --red:#ff2d2d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:460px;margin:0 auto;padding:28px 20px 48px}
.avatar{display:block;object-fit:cover;width:116px;height:116px;border-radius:50%;background:linear-gradient(135deg,#3b5bff,#ff8fb8);display:grid;place-items:center;color:#fff;font-weight:800;font-size:2.4rem}
h1{margin:26px 0 0;font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.bio{margin:12px 0 0;font-size:1.05rem;line-height:1.5;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1/1;padding:18px;border-radius:26px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;overflow:hidden;transition:transform .18s ease}
a.card:hover{transform:translateY(-3px)}
a.card:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wide{grid-column:span 2;aspect-ratio:2/1}
.icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem}
.label{margin:0;font-size:clamp(.72rem,3.4vw,.9rem);font-weight:500;line-height:1.35;white-space:nowrap}
.btn{display:inline-block;margin:0;padding:8px 18px;border-radius:99px;font-size:.88rem;line-height:1.2;font-weight:600;color:#fff}
.card>div:last-child{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.card:not(.work){justify-content:flex-start;gap:12px}
.card:not(.work)>div:last-child{display:contents}
.card:not(.work) .btn{margin-top:auto;align-self:flex-start}
.t-ig{background:#fff5f9}.t-wa{background:#f1fbf5}.t-yt{background:#fff3f3}.t-mail{background:#f4f6ff}
.i-dark{background:#111322}
.i-ig{background:linear-gradient(135deg,#feb64d,#f0508c 55%,#8f3fd1)}
.i-wa{background:var(--green)}.i-yt{background:var(--red)}.i-mail{background:var(--blue)}
.b-dark{background:#111322}.b-ig{background:linear-gradient(135deg,#f0508c,#8f3fd1)}
.b-wa{background:var(--green)}.b-yt{background:var(--red)}.b-mail{background:var(--blue)}
.stage{position:absolute;inset:0;overflow:hidden}
.work::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.5))}
.work>div:not(.stage){position:relative;z-index:1}
.work .label{color:#fff;font-size:1.05rem;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.stage i{position:absolute;display:block}
.s1{width:58px;height:58px;border-radius:50%;background:var(--blue);left:10%;top:14%;animation:f1 5s ease-in-out infinite}
.s2{width:52px;height:52px;border-radius:16px;background:#ffc6da;left:52%;top:42%;animation:spin 7s linear infinite}
.s3{width:88px;height:32px;border-radius:99px;background:#ffe27a;left:18%;top:68%;animation:f2 4.2s ease-in-out infinite}
.s4{width:28px;height:28px;border-radius:50%;background:#b7f0cf;left:68%;top:12%;animation:f2 3.4s ease-in-out infinite reverse}
.work:hover .stage i{animation-duration:1.6s}
@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,18px)}}
@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,-14px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.stage i{animation:none!important}}
.stage video{width:100%;height:100%;object-fit:cover;display:block}
#loader{position:fixed;inset:0;z-index:99;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease,visibility .5s}
#loader.done{opacity:0;visibility:hidden}
.ring{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:#ef4040;animation:spin .9s linear infinite}
.ltxt{font-weight:600;font-size:.95rem;color:var(--muted);letter-spacing:.02em}
.foot{text-align:center;margin-top:30px;font-size:.8rem;color:var(--muted)}
</style>
</head>
